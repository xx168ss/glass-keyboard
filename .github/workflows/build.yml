name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project GlassKeyboard.xcodeproj \
            -scheme GlassKeyboardHost \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/GlassKeyboardHost.app out/Payload/
          cd out
          zip -r GlassKeyboard.ipa Payload
          ls -lh GlassKeyboard.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-ipa
          path: out/GlassKeyboard.ipa
